# Development only (loaded automatically by "docker compose up").
# Publishes service ports to localhost for direct debugging. Bound to 127.0.0.1 only.
# In production-like runs use:  docker compose -f docker-compose.yml up -d
services:
  orders:
    ports:
      - "127.0.0.1:8001:8001"
  payments:
    ports:
      - "127.0.0.1:8002:8002"
  inventory:
    ports:
      - "127.0.0.1:8003:8003"
  cadvisor:   # only exists with --profile observability; debug access to the raw cAdvisor metrics
    ports:
      - "127.0.0.1:8081:8080"
