# SentinelOps target application (module M1). Compose file format v2: no "version:" key.
name: sentinelops

# Settings shared by every app service. Each service adds its own SERVICE_NAME, URLs and ports.
# APP_VERSION is deliberately NOT set here: it comes from the image (build arg -> ENV), so a
# rolled-back image always reports its own version.
x-app-environment: &app-environment
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-2.0}
  HTTP_MAX_CONNECTIONS: ${HTTP_MAX_CONNECTIONS:-50}
  DB_POOL_MIN_SIZE: ${DB_POOL_MIN_SIZE:-2}
  DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-10}
  DB_POOL_TIMEOUT_SECONDS: ${DB_POOL_TIMEOUT_SECONDS:-2.0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shop}
      # Required: copy .env.example to .env first (the password is never stored in the repo).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-shop}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # runs only on an empty data volume
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    labels:
      sentinelops.service: postgres
      sentinelops.tier: infra
    networks: [sentinelops]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Cache and idempotency keys only: no persistence needed.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    labels:
      sentinelops.service: redis
      sentinelops.tier: infra
    networks: [sentinelops]

  inventory:
    build:
      context: .   # repository root, so the Dockerfile can also copy common/
      dockerfile: services/inventory/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: sentinelops/inventory:${APP_VERSION:-1.0.0}   # versioned tag, needed later for rollbacks
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVICE_NAME: inventory
      DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-shop}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Liveness only (/health): a dependency outage must not make the container itself "unhealthy".
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      sentinelops.service: inventory
      sentinelops.tier: app
    networks: [sentinelops]

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: sentinelops/payments:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVICE_NAME: payments
      DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-shop}
      REDIS_URL: redis://redis:6379/0
      PAYMENT_DELAY_MS_MIN: ${PAYMENT_DELAY_MS_MIN:-20}
      PAYMENT_DELAY_MS_MAX: ${PAYMENT_DELAY_MS_MAX:-80}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      sentinelops.service: payments
      sentinelops.tier: app
    networks: [sentinelops]

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: sentinelops/orders:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVICE_NAME: orders
      DATABASE_URL: postgresql://${POSTGRES_USER:-shop}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@postgres:5432/${POSTGRES_DB:-shop}
      INVENTORY_URL: http://inventory:8003
      PAYMENTS_URL: http://payments:8002
    depends_on:
      postgres:
        condition: service_healthy
      inventory:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      sentinelops.service: orders
      sentinelops.tier: app
    networks: [sentinelops]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
    image: sentinelops/gateway:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    environment:
      <<: *app-environment
      SERVICE_NAME: gateway
      # Longer than the 2 s used between backend services, so a backend's own error answer
      # (e.g. orders reporting "inventory timed out") reaches the client instead of a generic 504.
      HTTP_TIMEOUT_SECONDS: ${GATEWAY_HTTP_TIMEOUT_SECONDS:-3.0}
      ORDERS_URL: http://orders:8001
      PAYMENTS_URL: http://payments:8002
    # The ONLY port published in the base file. Bound to localhost; remove "127.0.0.1:" to expose it on the LAN.
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      orders:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    labels:
      sentinelops.service: gateway
      sentinelops.tier: app
    networks: [sentinelops]

  # ---- optional tools, only started with --profile (never by a plain "docker compose up") ----

  # Load test: docker compose --profile load run --rm loadtest
  # USERS, SPAWN_RATE and DURATION come from .env (defaults 20, 2, 5m). CSV goes to loadtest/results/.
  loadtest:
    profiles: ["load"]
    build:
      context: .
      dockerfile: loadtest/Dockerfile
    image: sentinelops/loadtest:locust-2.46.6
    command:
      - "-f"
      - "/loadtest/locustfile.py"
      - "--headless"
      - "--host"
      - "http://gateway:8000"
      - "--users"
      - "${USERS:-20}"
      - "--spawn-rate"
      - "${SPAWN_RATE:-2}"
      - "--run-time"
      - "${DURATION:-5m}"
      - "--csv"
      - "/results/run"
      - "--html"
      - "/results/run_report.html"
    volumes:
      - ./loadtest/results:/results
    depends_on:
      gateway:
        condition: service_healthy
    labels:
      sentinelops.service: loadtest
      sentinelops.tier: infra
    networks: [sentinelops]

  # Unit tests inside python:3.12 (the host Python is 3.14):
  #   docker compose --profile test run --rm -e SERVICE=orders tests
  tests:
    profiles: ["test"]
    image: python:3.12-slim
    working_dir: /repo
    volumes:
      - .:/repo
    environment:
      SERVICE: inventory   # overridden with -e SERVICE=<gateway|orders|payments|inventory>
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    command:
      - "sh"
      - "-c"
      - "pip install -q --no-cache-dir -r services/$${SERVICE}/requirements.txt pytest==9.1.1 httpx==0.28.1 && PYTHONPATH=/repo:/repo/services/$${SERVICE} python -m pytest services/$${SERVICE}/tests -q -p no:cacheprovider"
    labels:
      sentinelops.service: tests
      sentinelops.tier: infra
    networks: [sentinelops]

  # ---- observability stack (module M2), only started with --profile observability ----
  # Start: docker compose --profile observability up -d --build --wait
  # A plain "docker compose up" never starts these services.

  # Metrics database. Scrapes the app services over the Docker network (config: observability/prometheus/).
  # Deliberately no depends_on on the app services: Prometheus must keep running (and show up = 0)
  # while an app service is stopped.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.15.0   # pinned exact tag, never "latest"
    restart: unless-stopped
    # Overriding "command" replaces the image defaults, so config.file and tsdb.path are repeated here.
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    ports:
      - "127.0.0.1:9090:9090"   # localhost only
    volumes:
      # Mount the DIRECTORY, not the single file: on Windows a file bind mount can keep showing the old
      # content after an editor replaces the file. Reload after edits: docker compose kill -s SIGHUP prometheus
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus   # "docker compose down -v" deletes this volume
    # Readiness (/-/ready), not only liveness: later services start only when queries can be answered.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      sentinelops.service: prometheus
      sentinelops.tier: observability
    networks: [sentinelops]

  # Container metrics exporter (CPU, memory, network, limits per container). Scraped by Prometheus.
  # Needs read access to the host (VM) cgroups and /proc, hence privileged + the mounts below.
  # No published port in this file; the override file publishes 127.0.0.1:8081 for debugging only.
  cadvisor:
    profiles: ["observability"]
    image: ghcr.io/google/cadvisor:v0.60.6   # pinned exact tag; images from v0.53.0 on live on ghcr.io
    restart: unless-stopped
    privileged: true   # documented requirement for reading other containers' cgroups and /proc entries
    command:
      - "--docker_only=true"                 # only Docker containers (plus root cgroup, dropped by Prometheus)
      - "--housekeeping_interval=5s"         # matches the 5s scrape interval
      - "--allow_dynamic_housekeeping=false" # never slow down to 60s for idle containers (would give stale values)
      - "--store_container_labels=false"     # no automatic label explosion ...
      - "--whitelisted_container_labels=com.docker.compose.service,sentinelops.service,sentinelops.tier"   # ... only these
      - "--enable_metrics=cpu,memory,network" # only the metric groups we use (disk, diskIO, percpu, oom_event, ... off)
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      # Docker API access for container names and labels. ":ro" on a socket does not limit API access;
      # cAdvisor only reads. The exposure is why this service is localhost-only and profile-gated.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Required on Docker Desktop (WSL2) with the containerd image store (docker info: Storage Driver
      # "overlayfs", driver-type io.containerd.snapshotter.v1). Without this socket cAdvisor logs
      # "unable to create containerd client ... containerd.sock: no such file or directory" and registers
      # no docker container factory, so no per-container series appear. The source path is the one inside
      # the Docker Desktop VM (verified there), NOT a Windows path. On other hosts it may not exist: Docker
      # then creates an empty directory at that path and cAdvisor still cannot connect. Adjust or remove it
      # there. Like docker.sock it gives cAdvisor privileged access to containerd (":ro" does not restrict
      # API access); acceptable only because the service is localhost-only and profile-gated.
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      sentinelops.service: cadvisor
      sentinelops.tier: observability
    networks: [sentinelops]

  # Log database (single binary, filesystem storage). Receives logs from Alloy, queried by Grafana (CP4) and M5.
  # No healthcheck: the Loki image is distroless (no shell, wget or curl). Readiness check from the host:
  # GET http://127.0.0.1:3100/ready  (it returns 503 "Ingester not ready" for about 15 s after start).
  loki:
    profiles: ["observability"]
    image: grafana/loki:3.7.8   # pinned exact tag, never "latest"
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yml"]
    ports:
      - "127.0.0.1:3100:3100"   # localhost only
    volumes:
      # Directory mount, same reason as for prometheus. This hides the image's own /etc/loki/local-config.yaml.
      - ./observability/loki:/etc/loki:ro
      - loki-data:/loki   # runs as uid 10001; the image owns /loki with that uid, so the volume is writable
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    labels:
      sentinelops.service: loki
      sentinelops.tier: observability
    networks: [sentinelops]

  # Log collector (replaces the end-of-life Promtail): reads container logs through the Docker API and pushes to Loki.
  # No healthcheck: the Alloy image has neither wget nor curl. Check from the host (override file publishes the port):
  # GET http://127.0.0.1:12345/-/ready
  # The image runs as root, which is what allows reading the Docker socket.
  alloy:
    profiles: ["observability"]
    image: grafana/alloy:v1.20.1   # pinned exact tag, never "latest"
    restart: unless-stopped
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--storage.path=/var/lib/alloy/data"
      - "--server.http.listen-addr=0.0.0.0:12345"   # default is 127.0.0.1 inside the container, unreachable from outside
      - "--disable-reporting"                       # no usage reporting to Grafana
    volumes:
      - ./observability/alloy:/etc/alloy:ro
      # Docker API access to list containers and read their logs. ":ro" on a socket does not limit API access;
      # Alloy only reads. Same exposure as cadvisor, hence profile-gated and with no published port in this file.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_started   # Loki has no healthcheck; Alloy retries pushes until Loki is ready
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    labels:
      sentinelops.service: alloy
      sentinelops.tier: observability
    networks: [sentinelops]

volumes:
  pgdata:
  prometheus-data:
  loki-data:

networks:
  sentinelops:
    name: sentinelops-net
